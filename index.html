<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>看山 · 阶段 1 诊断</title>
  </head>
  <body>
    <main>
      <h1>阶段 1：身份与部署诊断</h1>
      <p>此页只验证 Supabase 身份和愿望持久化链路；不含产品流程或正式视觉。</p>
      <p id="configuration-status" role="status">正在检查公开配置…</p>
      <div class="actions">
        <button id="anonymous-login" type="button">创建或恢复匿名会话</button>
        <button id="write-wish" type="button" disabled>写入测试愿望</button>
        <button id="read-wishes" type="button" disabled>读取我的愿望</button>
      </div>
      <section class="diagnostic-section" aria-labelledby="email-linking-title">
        <h2 id="email-linking-title">匿名账户绑定新邮箱</h2>
        <p>仅用于阶段 1 验证：先创建匿名会话和测试愿望，再绑定一个此前未注册的邮箱。绑定后应保持同一 UID。</p>
        <label>
          新邮箱
          <input id="link-email" type="email" autocomplete="email" placeholder="name@example.com" />
        </label>
        <label>
          邮箱变更验证码
          <input id="link-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="邮件中的验证码" />
        </label>
        <div class="actions">
          <button id="request-email-link" type="button" disabled>发送绑定验证码</button>
          <button id="verify-email-link" type="button" disabled>确认绑定并核对 UID</button>
        </div>
      </section>
      <section class="diagnostic-section" aria-labelledby="otp-login-title">
        <h2 id="otp-login-title">已有邮箱 OTP 登录</h2>
        <p>此入口明确设置为“不自动注册”。请只使用已经完成绑定的邮箱；登录会替换当前浏览器会话。</p>
        <label>
          已有邮箱
          <input id="login-email" type="email" autocomplete="email" placeholder="name@example.com" />
        </label>
        <label>
          登录验证码
          <input id="login-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="邮件中的验证码" />
        </label>
        <div class="actions">
          <button id="request-login-otp" type="button">发送已有账户登录验证码</button>
          <button id="verify-login-otp" type="button">验证登录验证码</button>
        </div>
      </section>
      <pre id="diagnostic-log" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
